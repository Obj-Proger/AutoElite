name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly as well, so that a vulnerability found in a package since the last change fails the build.
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The server, the client of the API, the website and their tests. The mobile application needs the MAUI workload,
  # which the mobile job installs, so this job builds the test projects, which reference everything else, and the
  # website.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # GitHub Actions sets CI=true, so Directory.Build.props turns every warning into an error, including those of
      # NuGet Audit about a package with a known vulnerability.
      - name: Build
        run: |
          for project in tests/*/*.csproj src/AutoElite.Web/AutoElite.Web.csproj; do
            dotnet build "$project" --configuration Release
          done

      # The packages with a known vulnerability, direct or transitive, listed by name; any of them fails the job.
      - name: Check for vulnerable packages
        run: |
          found=0
          for project in tests/*/*.csproj src/AutoElite.Web/AutoElite.Web.csproj; do
            report=$(dotnet list "$project" package --vulnerable --include-transitive --format json)
            vulnerable=$(echo "$report" | jq -r '.projects[].frameworks[]?
              | (.topLevelPackages[]?, .transitivePackages[]?)
              | select(.vulnerabilities != null and (.vulnerabilities | length) > 0)
              | "\(.id) \(.resolvedVersion): \([.vulnerabilities[].severity] | join(", "))"')
            if [ -n "$vulnerable" ]; then
              echo "::error title=Vulnerable packages in $project::${vulnerable//$'\n'/%0A}"
              echo "$vulnerable"
              found=1
            fi
          done
          exit $found

      - name: Test
        run: |
          for project in tests/*/*.csproj; do
            dotnet test --project "$project" --no-build --configuration Release
          done

  # The mobile application for Android and Windows, on Windows, where both targets build.
  mobile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install the MAUI workload
        run: dotnet workload install maui-android maui-windows

      - name: Build for Android
        run: dotnet build src/AutoElite.Mobile/AutoElite.Mobile.csproj --framework net10.0-android

      - name: Build for Windows
        run: dotnet build src/AutoElite.Mobile/AutoElite.Mobile.csproj --framework net10.0-windows10.0.19041.0
